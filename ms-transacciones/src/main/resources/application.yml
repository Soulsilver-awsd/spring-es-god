server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: ms-transacciones
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: tx_db
    default-schema: tx_db
    table: flyway_schema_history
    baseline-on-migrate: false
    validate-on-migrate: true
  cloud:
    loadbalancer:
      cache:
        ttl: 3s

app:
  # Identidad usada en X-Service-Instance y auditoriaTecnica.servicioOrigen (ej. ms-transacciones:8083)
  instance-id: ${INSTANCE_ID:ms-transacciones}:${server.port}
  db:
    health-check-interval-ms: 3000
    recovery-success-threshold: 2
    probe-query-timeout-seconds: 2
    primary:
      url: ${DB_PRIMARY_URL:jdbc:postgresql://primary:5432/${POSTGRES_DB:laboratorio}}
      username: ${TX_DB_USER}
      password: ${TX_DB_PASSWORD}
    replicas:
      - key: REPLICA_1
        url: ${DB_REPLICA1_URL:jdbc:postgresql://replica1:5432/${POSTGRES_DB:laboratorio}}
        username: ${TX_DB_USER}
        password: ${TX_DB_PASSWORD}
      - key: REPLICA_2
        url: ${DB_REPLICA2_URL:jdbc:postgresql://replica2:5432/${POSTGRES_DB:laboratorio}}
        username: ${TX_DB_USER}
        password: ${TX_DB_PASSWORD}
  cuentas:
    # Nombre logico resuelto por Spring Cloud LoadBalancer contra Eureka (prohibido IP/puerto fijo)
    base-url: http://ms-cuentas
    connect-timeout: 3s
    read-timeout: 5s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://eureka-server:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${INSTANCE_ID:${random.value}}:${server.port}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 12

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    db:
      # La caida de una replica no debe marcar el servicio DOWN (P06): el failover la tolera.
      ignore-routing-data-sources: true
