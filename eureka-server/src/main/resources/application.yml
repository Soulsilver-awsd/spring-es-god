server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 3000
    # Sin la cache de solo lectura (refresco cada 30 s) las altas y bajas se publican al instante (P03).
    use-read-only-response-cache: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
